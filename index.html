<main><div class="bar" id="ctl"></div><div id="alb"></div><div id="pg"></div></main><div id="rc"><div id="rcp"></div><div><button class="btn p" id="rcprint">🖨 In bằng hộp thoại</button> <button class="btn p" id="rcth">🧾 In máy in nhiệt</button> <button class="btn p" id="rcpdf">📄 Lưu PDF</button> <button class="btn" id="rcclose">Đóng</button></div><div class="card" id="prp" style="max-width:430px;width:92%;font-size:13px"><b>Kết nối máy in nhiệt (ESC/POS)</b><br><button class="btn" id="cs">Serial / Bluetooth</button> <button class="btn" id="cu">USB</button> Baud <input id="baud" type="number" value="9600" style="width:80px"> Khổ <select id="pap"><option value="576">80mm</option><option value="384">58mm</option></select><br><label><input type="checkbox" id="ap"> Tự in khi thanh toán</label><br><span id="prst" class="mut">Chưa kết nối. Cần Chrome/Edge. Có thể dùng "In bằng hộp thoại" cho mọi máy in.</span></div></div><div id="toast"></div><div id="modal"><div class="card" id="mb"></div></div>
<script>
/* ===== 1. DỮ LIỆU (đơn giá nguyên liệu là ước tính, sửa được ở trang Menu) ===== */
const CFG={name:'[TÊN QUÁN]',open:6.5,close:21.5,base:140,rent:30e6,labor:50e6,other:20e6,varPct:.06,cogsMax:.32,tMax:90,cash:4e8};
const HW={6:.07,7:.11,8:.10,9:.05,10:.04,11:.07,12:.10,13:.08,14:.05,15:.05,16:.05,17:.04,18:.03,19:.02,20:.02,21:.02}; // hệ số giờ (giả định)
const DOW=[.6,1.1,1.1,1.1,1.05,1,.7]; // CN,T2..T7 (giả định)
const ING0={cf:['Cà phê phin đậm','ml',40,5000,2],sd:['Sữa đặc','ml',44.6,5000,3],st:['Sữa tươi','ml',32.5,12000,1],kb:['Kem béo','ml',100,4000,1],da:['Đá viên','phần',500,500,1],ly:['Ly nắp ống hút','bộ',880,1500,3],nd:['Nước đường','ml',16.33,3000,3],ch:['Nước cốt chanh','ml',32,2000,3],to:['Tonic','ml',45,8000,3],so:['Soda','ml',13.9,8000,3],lc:['Lát chanh','cái',350,200,1],cd:['Nước cốt dừa','ml',60,4000,3],ds:['Dừa nạo sấy','g',60,1500,3],tra:['Trà nền','ml',12,15000,3],dao:['Syrup đào*','ml',120,3000,3],cam:['Cam lát*','lát',1500,150,1],sa:['Sả*','nhánh',500,150,1],tac:['Tắc*','quả',1500,150,1],mat:['Mật ong*','ml',150,1500,3],crs:['Croissant bơ*','cái',12000,60,1]};
const MENU0=[['cloud','Phin Cloud','Nhận diện',45000,70,.18,{cf:50,sd:30,st:30,kb:20,da:1,ly:1},'Cận cảnh lớp foam trắng mịn trên ly cà phê phin, ánh sáng cửa sổ'],
['tonic','Vietnamese Tonic','Signature',45000,45,.07,{cf:40,nd:15,ch:10,to:60,so:50,lc:1,da:1,ly:1},'Hai lớp màu tách rõ, lát chanh, bọt ga'],
['coco','Coconut Phin','Signature',49000,60,.09,{cf:50,sd:20,cd:40,kb:20,ds:10,da:1,ly:1},'Lớp cốt dừa, dừa sấy rắc mặt'],
['den','Phin Đen Đá','Món nền*',32000,50,.08,{cf:60,da:1,ly:1},'Ly cà phê đen đá, hạt rang bên cạnh'],
['sua','Phin Sữa Đá','Món nền*',35000,55,.2,{cf:50,sd:30,da:1,ly:1},'Phin đang nhỏ giọt trên ly'],
['bax','Bạc Xỉu','Món nền*',38000,55,.14,{cf:30,sd:30,st:60,da:1,ly:1},'Ly bạc xỉu 2 lớp'],
['lat','Latte Đá','Món nền*',42000,60,.06,{cf:50,st:150,da:1,ly:1},'Latte đá vân sữa'],
['dao','Trà Đào Cam Sả','Không cà phê*',45000,60,.06,{tra:150,dao:20,cam:1,sa:1,da:1,ly:1},'Trà đào, lát cam, nhánh sả'],
['tac','Trà Tắc Mật Ong','Không cà phê*',39000,50,.05,{tra:100,tac:1,mat:15,da:1,ly:1},'Ly trà tắc trong'],
['crs','Croissant Bơ','Ăn kèm*',35000,20,.07,{crs:1},'Croissant trên khay giấy']];
const STAFF=[['Nguyễn Thảo Vy','Quản lý',38000,1.0,1],['Trần Minh Khang','Barista chính',32000,1.15,1],['Lê Hoàng Anh','Barista chính',32000,1.1,1],['Phạm Ngọc Hân','Barista/thu ngân',27000,1.0,1],['Võ Quốc Bảo','Barista/thu ngân',27000,1.0,1],['Đặng Mỹ Linh','Part-time',23000,.85,0],['Bùi Gia Huy','Part-time',23000,.8,0],['Hoàng Khánh An','Part-time',23000,.85,0],['Ngô Thu Trang','Part-time',23000,.8,0]];
/* ===== 2. TRẠNG THÁI ===== */
const $=s=>document.querySelector(s),fm=n=>Math.round(n).toLocaleString('vi-VN')+'đ',pc=n=>Math.round(n*100)+'%',sh=n=>{const a=Math.abs(n),g=n<0?'-':'';return a>=1e9?g+(a/1e9).toFixed(2).replace('.',',')+' tỷ':a>=1e6?g+(a/1e6).toFixed(1).replace('.',',')+' triệu':fm(n)};
let S,IMG={},speed=60,paused=false,page='ov',realMode=false,cart=[],cartF={note:'',promo:'',pay:'Tiền mặt'},scn='bình thường',modalOpen=false;
const SC={'bình thường':{a:1},'tuần đông':{a:1.3},'mưa':{a:1.15},'thiếu người':{a:1,st:-1},'khuyến mãi':{a:1.25,disc:.15}};
function fresh(){const ing={};for(const k in ING0)ing[k]={p:ING0[k][2],s:ING0[k][3]*.8};const d=new Date();d.setHours(0,0,0,0);
S={v2:1,auto:false,date:d.getTime(),t:CFG.open*3600,ing,menu:MENU0.map(m=>({id:m[0],price:m[3]})),hist:[],today:newDay(),orders:[],oid:1,fx:[],extra:0,evAt:null,evDone:false,use:{},cfg:{...CFG}};
S.cons={};for(const k in ING0){let u=0,w=0;MENU0.forEach(m=>{w+=m[5];u+=m[5]*(m[6][k]||0)});S.use[k]=S.cfg.base*1.2*u/w;S.ing[k].s=S.use[k]*(ING0[k][4]+2)*1.6}setEv()}
function newDay(){return{o:0,rev:0,cogs:0,cups:0,lost:0,late:0,bad:0,hr:Array(24).fill(0),sold:{},stars:[],waits:[]}}
const M=id=>MENU0.find(m=>m[0]==id),price=id=>S.menu.find(m=>m.id==id).price;
function cost(id){const r=M(id)[6];let c=0;for(const k in r)c+=r[k]*S.ing[k].p;return c*1.05}
function avgTicket(){let w=0,p=0;MENU0.forEach(m=>{w+=m[5];p+=m[5]*(S?price(m[0]):m[3])});return p/w*1.2}
function cogsRatio(){let w=0,c=0,p=0;MENU0.forEach(m=>{w+=m[5];c+=m[5]*(S?cost(m[0]):0);p+=m[5]*(S?price(m[0]):m[3])});return c/p}
/* ===== 3. ENGINE GIẢ LẬP ===== */
const hr=()=>Math.floor(S.t/3600),dayF=()=>DOW[new Date(S.date).getDay()];
const fxv=k=>S.fx.filter(f=>f.k==k&&f.u>S.t).reduce((a,f)=>a*f.v,1);
function staffOn(){const h=hr(),pk=(h>=6&&h<9)||(h>=11&&h<17);let n=(pk?3:2)+S.extra+(SC[scn].st||0)+(S.fx.some(f=>f.k=='abs'&&f.u>S.t)?-1:0);return Math.max(1,Math.min(n,6))}
function team(){const n=staffOn(),b=STAFF.slice(1);return{n,sp:b.slice(0,n).reduce((a,s)=>a+s[3],0)/n,full:b.slice(0,n).filter(s=>s[4]).length}}
function pick(){let r=Math.random()*MENU0.reduce((a,m)=>a+m[5],0);for(const m of MENU0){r-=m[5];if(r<=0)return m[0]}return'sua'}
function arrive(src){const tm=team(),q=S.orders.filter(o=>o.st<2).reduce((a,o)=>a+o.items.length,0),est=q*55/tm.n;
 if(src!='pos'&&est>120&&Math.random()<Math.min(.7,(est-120)/200)){S.today.lost++;return}
 const nc=Math.random()<.2?2:1,items=[];for(let i=0;i<nc;i++)items.push({id:pick(),done:0,rem:null});newOrder(items,src||'sim')}
function newOrder(items,src,extra){const o={id:S.oid++,items,st:0,t0:S.t,src,pay:extra&&extra.pay||['Tiền mặt','Chuyển khoản','Ví điện tử'][Math.floor(Math.random()*3)],disc:(extra&&extra.disc)||SC[scn].disc||0,note:extra&&extra.note||'',ready:0};S.orders.push(o);S.today.hr[hr()]++;beep();if(src=='pos'||speed<=10)toast('Đơn #'+o.id+' mới');return o}
function step(dt){
 const sc=SC[scn],h=hr(),w=HW[h]||.01,tot=Object.values(HW).reduce((a,b)=>a+b,0);
 if(S.auto){let lam=S.cfg.base*dayF()*sc.a*fxv('arr')*w/tot/3600*dt;while(lam>0){if(Math.random()<Math.min(lam,1))arrive();lam--}}
 const tm=team();let act=S.orders.filter(o=>o.st==1).reduce((a,o)=>a+o.items.filter(i=>i.rem!=null&&i.rem>0).length,0);
 for(const o of S.orders){if(o.st>=2)continue;for(const it of o.items){if(it.done)continue;
  if(it.rem==null){if(act>=tm.n)continue;const r=M(it.id)[6];let ok=true;for(const k in r)if(S.ing[k].s<r[k])ok=false;
